name: Build GuardianLink Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Ensure Gradle Wrapper & Debug Keystore Are Present
        run: |
          status=0
          for f in gradlew gradle/wrapper/gradle-wrapper.jar debug.keystore; do
            if [ ! -f "$f" ]; then
              echo "::error file=.github/workflows/blank.yml::'$f' is missing from the repository. Commit it (it is required to build/sign the debug APK on CI)."
              status=1
            fi
          done
          [ $status -eq 0 ] || exit 1
          chmod +x ./gradlew

      - name: Build & Test APK
        # --max-workers=2 keeps peak memory low enough to avoid the runner's
        # OOM killer while building/testing (Robolectric spins up a JVM too).
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardianlink-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
